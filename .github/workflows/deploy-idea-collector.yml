name: Deploy Idea Collector

on:
  push:
    branches:
      - main
    paths:
      - 'apps/idea-collector/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    name: Terraform Apply
    runs-on: ubuntu:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.RUNNER_IAM_ROLE }}
          aws-region: ap-southeast-1
          role-session-name: "[Github Action Workflow] Deploy idea collector infra"

      - name: Terraform Init
        working-directory: apps/idea-collector/infra
        run: terraform init

      - name: Build Go Lambda
        working-directory: apps/idea-collector/backend
        run: make build || (GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bootstrap main.go)

      - name: Terraform Apply
        working-directory: apps/idea-collector/infra
        run: terraform apply -auto-approve

