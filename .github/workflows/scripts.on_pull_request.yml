name: Scripts tests

# Runs the Bash test suite for scripts/commit-workflow.sh (feature 003-standardize-commits).
# Standalone on purpose: it does not go through the shared `detect` job, so changing it
# never triggers the app and infrastructure pipelines.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.agents/skills/speckit-commit/**'
      - '.claude/skills/speckit-commit/**'
      - '.github/workflows/scripts.on_pull_request.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-workflow-tests:
    name: scripts / Commit workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh scripts/tests/cases/*.sh; do
            bash -n "$f"
          done

      - name: Run commit workflow tests
        shell: bash
        run: bash scripts/tests/commit-workflow.test.sh
