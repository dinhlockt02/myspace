name: On push main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to trigger (e.g. user-service,order-service). Leave empty = affected only"
        required: false
        default: ""
      all:
        description: "Trigger ALL services"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Nx can diff

      - uses: ./.github/actions/common/nx

      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            LIST=$(pnpm nx show projects --json)
          elif [ -n "${{ inputs.services }}" ]; then
            LIST=$(echo "${{ inputs.services }}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')
          else
            LIST=$(pnpm nx show projects --affected --json)
          fi
          echo "Afftected services: $LIST"
          echo "services=$LIST" >> "$GITHUB_OUTPUT"
  idea-collector:
    uses: ./.github/workflows/idea-collector.on_push.yml
    needs: detect
    if: contains(fromJson(needs.detect.outputs.services), 'idea-collector-infra')
    with:
      project: 'idea-collector-infra'

    
