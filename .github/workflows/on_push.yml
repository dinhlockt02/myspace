name: On push main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to trigger (e.g. user-service,order-service). Leave empty = affected only"
        required: false
        default: ""
      all:
        description: "Trigger ALL services"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Nx can diff

      - uses: ./.github/actions/common/nx

      - id: detect
        uses: ./.github/actions/common/detect
        with:
          services: ${{ inputs.services }}
          all: ${{ inputs.all }}
  idea-collector:
    uses: ./.github/workflows/idea-collector.on_push.yml
    needs: detect
    if: contains(fromJson(needs.detect.outputs.services), 'idea-collector-infra')
    with:
      project: 'idea-collector-infra'
  commifra:
    uses: ./.github/workflows/commifra.on_push.yml
    needs: detect
    if: contains(fromJson(needs.detect.outputs.services), 'commifra')
