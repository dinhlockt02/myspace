name: Deploy Idea Collector Frontend

on:
  workflow_dispatch:
    inputs:
      s3_bucket:
        description: "S3 Bucket Name (default: idea.dinhloc.dev)"
        required: false
        default: "idea.dinhloc.dev"
      cloudfront_distribution_id:
        description: "CloudFront Distribution ID (leave blank to auto-discover)"
        required: false
        default: ""
  workflow_call:
    inputs:
      s3_bucket:
        description: "S3 Bucket Name (default: idea.dinhloc.dev)"
        type: string
        required: false
        default: "idea.dinhloc.dev"
      cloudfront_distribution_id:
        description: "CloudFront Distribution ID (leave blank to auto-discover)"
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend to CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup AWS
        uses: ./.github/actions/common/aws
        with:
          role-to-assume: "arn:aws:iam::486049703479:role/idea-collector-runner"

      - name: Setup Nx
        uses: ./.github/actions/common/nx

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve Deployment Targets
        id: resolve
        shell: bash
        env:
          INPUT_S3_BUCKET: ${{ inputs.s3_bucket }}
          INPUT_CLOUDFRONT_DIST_ID: ${{ inputs.cloudfront_distribution_id }}
        run: |
          S3_BUCKET="${INPUT_S3_BUCKET}"
          CLOUDFRONT_DIST_ID="${INPUT_CLOUDFRONT_DIST_ID}"

          if [ -z "$S3_BUCKET" ] || [ "$S3_BUCKET" = "null" ]; then
            S3_BUCKET="idea.dinhloc.dev"
          fi

          if [ -z "$CLOUDFRONT_DIST_ID" ] || [ "$CLOUDFRONT_DIST_ID" = "null" ]; then
            echo "Resolving CloudFront distribution ID from AWS CLI..."
            CLOUDFRONT_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${S3_BUCKET}')].Id | [0]" --output text)
          fi

          echo "Resolved S3_BUCKET=${S3_BUCKET}"
          echo "Resolved CLOUDFRONT_DIST_ID=${CLOUDFRONT_DIST_ID}"

          if [ -z "$CLOUDFRONT_DIST_ID" ] || [ "$CLOUDFRONT_DIST_ID" = "None" ]; then
            echo "::error::Could not determine CloudFront Distribution ID"
            exit 1
          fi

          echo "s3_bucket=${S3_BUCKET}" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=${CLOUDFRONT_DIST_ID}" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to CloudFront
        shell: bash
        env:
          S3_BUCKET: ${{ steps.resolve.outputs.s3_bucket }}
          CLOUDFRONT_DIST_ID: ${{ steps.resolve.outputs.cloudfront_distribution_id }}
        run: pnpm nx run idea-collector-frontend:deploy
