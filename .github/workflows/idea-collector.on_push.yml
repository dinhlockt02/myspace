name: On push Idea Collector

on: 
  workflow_call:
    inputs:
      project:
        type: string
        required: false
        default: 'idea-collector'
      deploy_infra:
        type: boolean
        required: false
        default: true
      deploy_frontend:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Deploy Terraform infrastructure"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy frontend to CloudFront/S3"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  apply-infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_infra != false }}
    outputs:
      s3_bucket_name: ${{ steps.outputs.outputs.s3_bucket_name }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/idea-collector/setup

      - id: init
        shell: bash
        run: pnpm nx run idea-collector-infra:init

      - id: validate
        shell: bash
        run: pnpm nx run idea-collector-infra:validate

      - id: apply
        shell: bash
        env:
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: pnpm nx run idea-collector-infra:apply

      - id: outputs
        shell: bash
        run: |
          echo "s3_bucket_name=$(terraform -chdir=apps/idea-collector/infra output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform -chdir=apps/idea-collector/infra output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

  deploy-frontend:
    name: Deploy Frontend to CloudFront
    needs: [apply-infra]
    runs-on: ubuntu-latest
    if: always() && (needs.apply-infra.result == 'success' || needs.apply-infra.result == 'skipped') && (inputs.deploy_frontend != false)
    steps:
      - uses: actions/checkout@v4

      - name: Setup AWS
        uses: ./.github/actions/common/aws
        with:
          role-to-assume: "arn:aws:iam::486049703479:role/idea-collector-runner"

      - name: Setup Nx
        uses: ./.github/actions/common/nx

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve Deployment Targets
        id: resolve
        shell: bash
        env:
          INFRA_S3_BUCKET: ${{ needs.apply-infra.outputs.s3_bucket_name }}
          INFRA_CLOUDFRONT_DIST_ID: ${{ needs.apply-infra.outputs.cloudfront_distribution_id }}
        run: |
          S3_BUCKET="${INFRA_S3_BUCKET}"
          CLOUDFRONT_DIST_ID="${INFRA_CLOUDFRONT_DIST_ID}"

          if [ -z "$S3_BUCKET" ] || [ "$S3_BUCKET" = "null" ]; then
            S3_BUCKET="idea.dinhloc.dev"
          fi

          if [ -z "$CLOUDFRONT_DIST_ID" ] || [ "$CLOUDFRONT_DIST_ID" = "null" ]; then
            echo "Resolving CloudFront distribution ID from AWS CLI..."
            CLOUDFRONT_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${S3_BUCKET}')].Id | [0]" --output text)
          fi

          echo "Resolved S3_BUCKET=${S3_BUCKET}"
          echo "Resolved CLOUDFRONT_DIST_ID=${CLOUDFRONT_DIST_ID}"

          if [ -z "$CLOUDFRONT_DIST_ID" ] || [ "$CLOUDFRONT_DIST_ID" = "None" ]; then
            echo "::error::Could not determine CloudFront Distribution ID"
            exit 1
          fi

          echo "s3_bucket=${S3_BUCKET}" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=${CLOUDFRONT_DIST_ID}" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to CloudFront
        shell: bash
        env:
          S3_BUCKET: ${{ steps.resolve.outputs.s3_bucket }}
          CLOUDFRONT_DIST_ID: ${{ steps.resolve.outputs.cloudfront_distribution_id }}
        run: pnpm nx run idea-collector-frontend:deploy
