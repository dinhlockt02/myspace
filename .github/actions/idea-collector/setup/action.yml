name: Setup Idea Collector
description: Setup all tools and dependencies required for Idea Collector workflows

inputs:
  backend-working-directory:
    description: "Working directory for idea-collector backend"
    required: false
    default: "apps/idea-collector/backend"
  terraform-version:
    description: "Terraform version"
    required: false
    default: "1.9.0"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: ./.github/actions/common/terraform
      with:
        terraform-version: ${{ inputs.terraform-version }}

    - name: Setup Go
      uses: ./.github/actions/common/go
      with:
        go-version-file: ${{ inputs.backend-working-directory }}/go.mod
        cache-dependency-path: ${{ inputs.backend-working-directory }}/go.sum

    - name: Setup AWS
      uses: ./.github/actions/common/aws
      with:
        role-to-assume: "arn:aws:iam::486049703479:role/github-actions-myspace"


    - name: Setup Nx
      uses: ./.github/actions/common/nx

    - name: Build Idea Collector Dependencies
      uses: ./.github/actions/idea-collector/dependencies
      with:
        working-directory: ${{ inputs.backend-working-directory }}
