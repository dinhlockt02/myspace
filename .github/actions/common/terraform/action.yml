name: Setup Terraform
description: Install Terraform CLI

inputs:
  terraform-version:
    description: "Terraform version to install"
    required: false
    default: "1.9.0"
  terraform-wrapper:
    description: "Whether to install the Terraform wrapper"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: ${{ inputs.terraform-wrapper }}
