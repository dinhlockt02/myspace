name: Setup Idea Collector
description: Setup all tools and dependencies required for Idea Collector workflows

inputs:
  checkout:
    description: "Whether to checkout the repository"
    required: false
    default: "true"
  fetch-depth:
    description: "Fetch depth for git checkout"
    required: false
    default: "0"
  backend-working-directory:
    description: "Working directory for idea-collector backend"
    required: false
    default: "apps/idea-collector/backend"
  terraform-version:
    description: "Terraform version"
    required: false
    default: "1.9.0"

runs:
  using: composite
  steps:
    - name: Checkout repository
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup Terraform
      uses: ./.github/actions/common/terraform
      with:
        terraform-version: ${{ inputs.terraform-version }}

    - name: Setup AWS
      uses: ./.github/actions/common/aws

    - name: Setup Nx
      uses: ./.github/actions/common/nx