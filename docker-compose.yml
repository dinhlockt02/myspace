services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: myspace-dynamodb-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "[ $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/) -eq 400 ] || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
